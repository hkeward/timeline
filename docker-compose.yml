services:
  site:
    image: registry.somanydoors.ca/heather/timeline:${CI_COMMIT_SHORT_SHA:-main}
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.timeline.rule=Host(`timeline.heatherward.dev`)"
      - "traefik.http.routers.timeline.entrypoints=https"
      - "traefik.http.routers.timeline.tls.certresolver=cloudflaredns"
      - "traefik.http.services.timeline.loadbalancer.passhostheader=true"
      - "traefik.http.services.timeline.loadbalancer.server.port=80"
networks:
  proxy:
    external: true
